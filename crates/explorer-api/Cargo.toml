[package]
name = "karlsen-explorer-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "karlsen_explorer_api"
path = "src/lib.rs"

[[bin]]
name = "karlsen-explorer-api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
hex = "0.4"
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tonic = { version = "0.14", features = ["router"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"
